plugins {
    id 'com.android.application'
}

android {
    namespace 'com.a23bc.ammod'
    compileSdk 35

    defaultConfig {
        applicationId 'com.a23bc.ammod'
        minSdk 30
        targetSdk 35
        versionCode 4
        versionName '0.2.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // compileOnly：Xposed API 由 LSPosed 在目标进程里提供，绝不能打进 APK。
    compileOnly 'de.robv.android.xposed:api:82'
}
