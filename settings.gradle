pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // Xposed API 82 不发布在 Maven Central，官方仓库优先，阿里云 public 作兜底。
        maven { url 'https://api.xposed.info/' }
        maven { url 'https://maven.aliyun.com/repository/public/' }
    }
}

rootProject.name = 'AM Mod'
include ':app'
